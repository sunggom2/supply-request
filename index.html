<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151b34">
<title>주소가 변경되었습니다 · 비품 신청</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{ --bg:#f2f4f8; --card:#fff; --fg:#141824; --muted:#707888; --line:#e5e8f0; }
@media (prefers-color-scheme:dark){
  :root{ --bg:#0d0f16; --card:#161a24; --fg:#eef0f6; --muted:#949cae; --line:#262c3a; }
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
  background:var(--bg); color:var(--fg);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  letter-spacing:-.01em; -webkit-font-smoothing:antialiased;
}
.box{
  max-width:400px; width:100%; text-align:center;
  background:var(--card); border:1px solid var(--line); border-radius:18px;
  padding:36px 26px; box-shadow:0 1px 2px rgba(20,24,36,.05), 0 8px 24px rgba(20,24,36,.06);
}
.mark{
  width:64px; height:64px; margin:0 auto 20px; border-radius:50%;
  background:radial-gradient(120% 140% at 20% 0%,#2f5bea,#1d2a63);
  display:grid; place-items:center; color:#fff;
}
.mark svg{width:30px;height:30px}
h1{margin:0 0 10px; font-size:20px; font-weight:800; letter-spacing:-.03em}
p{margin:0; font-size:14.5px; line-height:1.65; color:var(--muted)}
</style>
</head>
<body>
  <div class="box">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/>
        <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
      </svg>
    </div>
    <h1>주소가 변경되었습니다</h1>
    <p>비품 신청 페이지 주소는 리더 교체 시점마다 새로 발급됩니다.<br>
       비품 관리자에게 현재 주소를 문의해 주세요.</p>
  </div>
</body>
</html>
