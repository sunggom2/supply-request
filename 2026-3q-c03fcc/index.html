<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ede9f9">
<title>비품 신청 · 두드림원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 두드림원 직원 포털과 동일한 디자인 시스템.
   색·그림자·반경 값은 포털 login.html / portal.html 에서 그대로 가져왔다.
   포털이 라이트 전용이라 여기도 다크모드를 두지 않는다. */
:root{
  --ink:#2d3748; --label:#4a5568; --muted:#718096;
  --primary:#8b7ff0; --primary-deep:#5b4fd6;
  --grad:linear-gradient(135deg,#8b7ff0 0%,#c780d8 100%);
  --line:rgba(139,127,240,.14);
  --line-strong:rgba(139,127,240,.30);
  --soft:#f4f1fe;
  --shadow:0 4px 15px rgba(139,127,240,.10);
  --radius:16px;
  --page-bg:
    radial-gradient(circle at 18% 20%, rgba(196,181,253,.55) 0%, transparent 42%),
    radial-gradient(circle at 84% 24%, rgba(251,207,232,.50) 0%, transparent 42%),
    radial-gradient(circle at 50% 92%, rgba(186,230,253,.50) 0%, transparent 45%),
    linear-gradient(160deg,#f5f5fd 0%,#ede9f9 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
/* 배경을 고정 레이어로 깔아둔다. body 에 직접 주면 내용이 길어질 때
   radial 이 늘어나 포털과 다른 그림이 된다. */
body::before{content:'';position:fixed;inset:0;z-index:-1;background:var(--page-bg)}
body{
  color:var(--ink);
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(104px + env(safe-area-inset-bottom));
}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}

/* ── 헤더 ───────────────────────────────── */
.head{padding:calc(30px + env(safe-area-inset-top)) 0 6px;text-align:center}
.head h1{margin:0 0 4px;font-size:26px;font-weight:700;color:var(--ink)}
.head .sub{font-size:14px;color:var(--muted);font-weight:400}
.head .note{margin:14px 0 0;font-size:13.5px;color:var(--muted);line-height:1.6}
.head .note[hidden]{display:none}
.site{
  display:inline-flex;align-items:center;gap:8px;margin-top:16px;
  padding:11px 18px;border-radius:999px;
  background:#fff;border:1px solid var(--line-strong);box-shadow:var(--shadow);
  font-size:16px;font-weight:700;color:var(--primary-deep);
}
.site svg{width:17px;height:17px;flex:none;color:var(--primary)}
.site[hidden]{display:none}

/* ── 섹션 ───────────────────────────────── */
.card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px 16px;margin-bottom:14px;
}
.card[hidden]{display:none}
.sec-head{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.step{
  width:22px;height:22px;flex:none;border-radius:7px;background:var(--grad);color:#fff;
  font-size:12px;font-weight:700;display:grid;place-items:center;
}
.step[hidden]{display:none}
.sec-head h2{margin:0;font-size:16px;font-weight:700;color:var(--ink)}
.sec-head .hint{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:500}

/* ── 근무 지역 칩 ────────────────────────── */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{
  appearance:none;border:1px solid var(--line-strong);background:#fff;color:var(--label);
  font:inherit;font-size:14.5px;font-weight:500;
  padding:13px 6px;border-radius:12px;cursor:pointer;transition:.2s;
}
.chip:hover{border-color:var(--primary)}
.chip[aria-pressed="true"]{
  background:var(--grad);border-color:transparent;color:#fff;font-weight:700;
  box-shadow:0 4px 14px rgba(139,127,240,.35);
}

/* ── 품목 ───────────────────────────────── */
.items{display:flex;flex-direction:column;gap:8px}
.item{
  display:flex;align-items:center;gap:12px;width:100%;
  border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;
  padding:13px 14px;border-radius:13px;cursor:pointer;text-align:left;transition:.2s;
}
.item:hover{border-color:var(--line-strong)}
.item[aria-pressed="true"]{background:var(--soft);border-color:var(--primary)}
.item .ico{width:26px;height:26px;flex:none;color:#aaa4cc;transition:.2s}
.item[aria-pressed="true"] .ico{color:var(--primary)}
.item .name{flex:1;font-size:15.5px;font-weight:500}
.item[aria-pressed="true"] .name{font-weight:700}
.tick{
  width:22px;height:22px;flex:none;border:1.8px solid var(--line-strong);border-radius:50%;
  display:grid;place-items:center;transition:.2s;background:#fff;
}
.tick svg{width:13px;height:13px;color:#fff;opacity:0;transform:scale(.5);transition:.2s}
.item[aria-pressed="true"] .tick{background:var(--grad);border-color:transparent}
.item[aria-pressed="true"] .tick svg{opacity:1;transform:scale(1)}

/* 장갑 그룹 */
.group{border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 14px;transition:.2s}
.group.on{border-color:var(--primary);background:var(--soft)}
.group-top{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.group-top .ico{width:26px;height:26px;flex:none;color:#aaa4cc;transition:.2s}
.group.on .group-top .ico{color:var(--primary)}
.group-top .name{font-size:15.5px;font-weight:500}
.group.on .group-top .name{font-weight:700}
.group-top .sub{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:500}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.size{
  appearance:none;border:1.5px solid var(--line-strong);background:#fff;color:var(--muted);
  font:inherit;font-size:14px;font-weight:700;padding:10px 0;border-radius:10px;cursor:pointer;transition:.2s;
}
.size[aria-pressed="true"]{
  background:var(--grad);border-color:transparent;color:#fff;
  box-shadow:0 4px 12px rgba(139,127,240,.3);
}

/* ── 하단 제출 바 ───────────────────────── */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,.7);
  box-shadow:0 -4px 24px rgba(120,100,180,.10);
  padding:12px 0 calc(12px + env(safe-area-inset-bottom));
}
.bar .wrap{display:flex;align-items:center;gap:12px}
.errwrap{max-width:520px;margin:0 auto;padding:0 16px}
.err{display:none;margin-bottom:10px;padding:11px 13px;border-radius:11px;
  background:#fdeaec;color:#c53030;border:1px solid rgba(197,48,48,.14);
  font-size:13.5px;font-weight:500;line-height:1.45}
.err.show{display:block}
.summary{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.35}
.summary b{display:block;color:var(--ink);font-size:14px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.submit{
  flex:none;appearance:none;border:0;border-radius:12px;cursor:pointer;
  background:var(--grad);color:#fff;font:inherit;font-size:15.5px;font-weight:700;
  padding:14px 26px;transition:.3s;box-shadow:0 4px 14px rgba(139,127,240,.35);
}
.submit:disabled{background:#e8e5f6;color:#a9a4c4;box-shadow:none;cursor:not-allowed}
.submit:not(:disabled):active{opacity:.8}

.foot{text-align:center;font-size:12.5px;color:var(--muted);padding:4px 0 8px}

/* ── 폐기된 링크 화면 ───────────────────── */
.gone{position:fixed;inset:0;z-index:60;background:var(--page-bg);display:grid;place-items:center;padding:24px}
.gone[hidden]{display:none}
.gone .box{
  width:100%;max-width:400px;text-align:center;
  background:rgba(255,255,255,.50);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.70);border-radius:24px;
  padding:44px 32px;box-shadow:0 12px 40px rgba(120,100,180,.18);
}
.gone .mark{
  width:64px;height:64px;margin:0 auto 22px;border-radius:50%;background:var(--grad);
  display:grid;place-items:center;color:#fff;box-shadow:0 8px 24px rgba(139,127,240,.35);
}
.gone .mark svg{width:29px;height:29px}
.gone h2{margin:0 0 6px;font-size:20px;font-weight:700;color:var(--ink)}
.gone .company{font-size:14px;color:var(--muted);margin-bottom:20px}
.gone p{margin:0;font-size:14.5px;line-height:1.7;color:var(--muted)}

/* ── 완료 화면 ──────────────────────────── */
.done{
  position:fixed;inset:0;z-index:50;background:var(--page-bg);
  display:none;place-items:center;padding:24px;
}
.done.show{display:grid;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.done-inner{width:100%;max-width:400px;text-align:center}
.check{
  width:76px;height:76px;margin:0 auto 20px;border-radius:50%;background:var(--grad);
  display:grid;place-items:center;animation:pop .4s cubic-bezier(.2,1.4,.4,1);
  box-shadow:0 8px 24px rgba(139,127,240,.35);
}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.check svg{width:36px;height:36px;color:#fff}
.done h2{margin:0 0 8px;font-size:23px;font-weight:700;color:var(--ink)}
.done>.done-inner>p{margin:0 0 22px;font-size:14.5px;color:var(--muted);line-height:1.6}
.receipt{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;text-align:left;margin-bottom:22px;box-shadow:var(--shadow);
}
.receipt .row{display:flex;gap:12px;padding:9px 0;font-size:14.5px}
.receipt .row+.row{border-top:1px dashed var(--line-strong)}
.receipt .k{color:var(--muted);flex:none;width:70px;font-size:13.5px;padding-top:1px}
.receipt .v{font-weight:500}
.again{
  width:100%;appearance:none;border:1px solid var(--line-strong);background:#fff;color:var(--label);
  font:inherit;font-size:15.5px;font-weight:600;padding:15px;border-radius:12px;cursor:pointer;
  box-shadow:var(--shadow);
}
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:360px){ .chips{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>

<header class="head">
  <div class="wrap">
    <h1>비품 신청</h1>
    <div class="sub">(주) 두드림원</div>
    <div class="site" id="site" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/>
      </svg>
      <span id="siteName"></span>
    </div>
    <!-- 리더용 문구가 기본값. 관리자·비서 화면은 스크립트가 바꾸거나 숨긴다. -->
    <p class="note" id="note">비품 너무 쌓아두지 마세요! 😄</p>
  </div>
</header>

<main class="wrap">
  <section class="card" id="regionCard">
    <div class="sec-head">
      <span class="step">1</span><h2>근무 지역</h2>
      <span class="hint">1곳 선택</span>
    </div>
    <div class="chips" id="regions"></div>
  </section>

  <section class="card">
    <div class="sec-head">
      <span class="step" id="itemStep">2</span><h2>비품 요청 물품</h2>
      <span class="hint">중복 선택</span>
    </div>
    <div class="items" id="items"></div>
  </section>

  <!-- 예전에는 여기에 구글폼 직행 링크를 뒀지만, 인증 코드로 폼을 잠근 뒤로는
       그 링크를 타면 반드시 거부당한다. 막다른 길이라 안내 문구로 바꿨다. -->
  <p class="foot">신청이 안 되면 부소장에게 연락해 주세요.</p>
</main>

<div class="bar">
  <div class="errwrap">
    <div class="err" id="error">전송에 실패했어요. 통신 상태를 확인하고 다시 시도해 주세요.</div>
  </div>
  <div class="wrap">
    <div class="summary" id="summary"><b>근무 지역을 선택하세요</b>선택한 비품 0개</div>
    <button class="submit" id="submit" disabled>신청하기</button>
  </div>
</div>

<!-- 폐기된 ?w 값으로 들어온 경우. 예전 정문 묶음 링크처럼 없앤 주소가
     폴백을 타고 계속 살아 있는 것을 막는다. -->
<div class="gone" id="gone" hidden>
  <div class="box">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/>
        <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
      </svg>
    </div>
    <h2>더 이상 사용하지 않는 주소입니다</h2>
    <div class="company">(주) 두드림원</div>
    <p>부소장에게 현재 주소를 문의해 주세요.</p>
  </div>
</div>

<div class="done" id="done">
  <div class="done-inner">
    <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg></div>
    <h2>신청이 접수됐어요</h2>
    <p>담당자에게 알림이 전송됐습니다.<br>지급까지 잠시만 기다려 주세요.</p>
    <div class="receipt" id="receipt"></div>
    <button class="again" id="again">새로 신청하기</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var ENDPOINT = "https://docs.google.com/forms/d/e/1FAIpQLSfLkfTdvTEFNwvyorEk_E9_OjeTUP9S45iHv5_K3BqzojfIKA/formResponse";
  var ENTRY_REGION = "entry.1000057";
  var ENTRY_ITEMS  = "entry.1000027";

  // 인증 코드 — 이미 퍼진 구글폼 주소를 막기 위한 잠금장치.
  // 구글폼에 "인증 코드" 질문(단답형·필수·정규식 일치)을 추가한 뒤 두 값을 채우면 켜진다.
  // 하나라도 비어 있으면 코드를 보내지 않는다(= 지금까지와 동일하게 동작).
  // 값을 바꿀 때는 반드시 verify.ps1로 검증할 것. 어긋나면 리더에게는
  // 성공 화면이 뜨는데 시트에는 아무것도 안 쌓인다.
  var ENTRY_CODE  = "entry.521168683";
  var ACCESS_CODE = "Q3-912F36";

  var REGIONS = ["서관 1","서관 2","동관 후문","동관 정문","동관 지하","신관 정문","신관 지하"];

  // 근무지별 링크 — 주소 뒤에 ?w=코드 를 붙이면 그 근무지 전용 화면이 된다.
  // 값이 1곳이면 근무 지역 선택 단계가 아예 사라지고 헤더에 근무지가 고정 표시된다.
  // 값이 여러 곳이면 그 목록만 고르게 한다.
  // ?w 가 없거나 모르는 코드면 7곳 전부 보여준다. 고정 주소(manage-*, staff-*)가
  // 이 화면으로 들어오고, 잘못된 링크에 대한 안전한 폴백 역할도 겸한다.
  var SITES = {
    "seo1":     ["서관 1"],
    "seo2":     ["서관 2"],
    "dong-h":   ["동관 후문"],
    "dong-b":   ["동관 지하"],
    "sin-b":    ["신관 지하"]
    // 동관 정문·신관 정문은 비서가 맡는다. 비서는 슬롯 밖 고정 주소(staff-*)로
    // 들어와 7곳 중에서 고르므로 여기에 항목이 없다.
  };
  // 구글폼 원본 순서 — 스프레드시트 셀 문자열을 기존과 동일하게 유지하기 위해 이 순서로 전송한다.
  var ITEM_ORDER = ["페이퍼 타올","크리넬 티슈","장갑 S","장갑 M","장갑 L","키오스크 용지","손소독제(근무지용)",
                    "키오스크 용지(전체)"];

  var ICONS = {
    towel:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.66 3.13 3 7 3s7-1.34 7-3V6"/><ellipse cx="12" cy="6" rx="2.4" ry="1"/>',
    tissue:'<rect x="3" y="11.5" width="18" height="8.5" rx="2"/><path d="M8 11.5l2-5.5 2 2.2 2-4.2 2 7.5"/>',
    glove:'<path d="M8 21v-4.8l-1.9-2.4a1.8 1.8 0 0 1 2.7-2.3L10 12.6V5a1.5 1.5 0 0 1 3 0v5.5M13 10.5V4a1.5 1.5 0 0 1 3 0v6.5M16 10.5V7a1.5 1.5 0 0 1 3 0v8a6 6 0 0 1-6 6z"/>',
    receipt:'<path d="M6 3h12v18l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4L6 21z"/><path d="M9.2 8.5h5.6M9.2 12.5h5.6"/>',
    sanitizer:'<rect x="9" y="2" width="5" height="3.6" rx="1.2"/><path d="M14 3.4h2.8l-1.5 2.6"/><path d="M7.6 11a3.6 3.6 0 0 1 3.6-3.6h1.2A3.6 3.6 0 0 1 16 11v8.2a2.4 2.4 0 0 1-2.4 2.4h-3.6A2.4 2.4 0 0 1 7.6 19.2z"/>'
  };
  function svg(name, cls) {
    return '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
           'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + ICONS[name] + '</svg>';
  }
  var TICK = '<span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5L19.5 7"/></svg></span>';

  var LAYOUT = [
    { kind:"one",   value:"페이퍼 타올",        icon:"towel"     },
    { kind:"one",   value:"크리넬 티슈",        icon:"tissue"    },
    { kind:"glove", sizes:["장갑 S","장갑 M","장갑 L"], icon:"glove" },
    { kind:"one",   value:"키오스크 용지",      icon:"receipt"   },
    // full:true 는 관리자·비서 화면(고정 주소)에서만 보인다. 근무지 리더 링크에는
    // 나타나지 않는다. 화면 순서는 여기서, 전송 순서는 ITEM_ORDER 가 정한다.
    { kind:"one",   value:"키오스크 용지(전체)", icon:"receipt", full:true },
    { kind:"one",   value:"손소독제(근무지용)", icon:"sanitizer" }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var region = null;
  var picked = {};          // { "장갑 S": true, ... }
  var sending = false;

  // 이 링크가 담당하는 근무지
  var slug = new URLSearchParams(location.search).get("w");

  // ?w 가 아예 없으면 고정 주소(manage-*, staff-*)로 들어온 것이라 7곳을 보여준다.
  // ?w 가 있는데 목록에 없으면 폐기된 링크다. 조용히 7곳으로 넘기면 없앤 주소가
  // 계속 살아 있는 셈이 되므로 여기서 끊는다.
  if (slug !== null && !SITES[slug]) {
    $("gone").hidden = false;
    document.title = "사용하지 않는 주소 · 비품 신청";
    return;
  }

  var ALLOWED = slug ? SITES[slug] : REGIONS;
  var LOCKED = ALLOWED.length === 1;
  // 고정 주소(manage-*, staff-*)는 ?w 없이 들어온다. 전 근무지용 품목은
  // 그 화면에서만 보여준다.
  var FULL = (slug === null);

  // 관리자와 비서는 둘 다 ?w 없이 같은 화면으로 들어오므로 ?w 로는 구분되지 않는다.
  // 그래서 고정 주소 stub 이 ?v 로 자기가 누구인지 알려준다.
  //   ?v=admin  관리자   안내 문구 없음
  //   ?v=sec    비서
  //   그 외     근무지 리더 (기본 문구, HTML 에 그대로 적혀 있다)
  var VIEWER = new URLSearchParams(location.search).get("v");
  if (VIEWER === "sec") {
    $("note").textContent = "비품 관리 정확히 하도록";
  } else if (FULL) {
    // 관리자 화면. ?v=admin 으로 오든 슬롯 주소로 바로 오든, 7곳이 다 보이는
    // 화면이면 리더용 문구는 띄우지 않는다. ?v 유무로 갈리면 같은 화면인데
    // 문구만 다른 상태가 되어 헷갈린다.
    $("note").hidden = true;
  }

  /* ── 렌더 ──────────────────────────────── */
  var regionBox = $("regions");
  if (LOCKED) {
    // 근무지가 하나뿐이면 고르게 하지 않는다. 대신 헤더에 못박아 보여줘서
    // 리더가 "내 근무지로 나가는 게 맞나"를 한눈에 확인할 수 있게 한다.
    region = ALLOWED[0];
    $("siteName").textContent = region;
    $("site").hidden = false;
    $("regionCard").hidden = true;
    $("itemStep").hidden = true;
    document.title = region + " 비품 신청 · 두드림원";
  } else {
    if (ALLOWED.length < 3) {
      regionBox.style.gridTemplateColumns = "repeat(" + ALLOWED.length + ",1fr)";
    }
    ALLOWED.forEach(function (r) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = r;
      b.setAttribute("aria-pressed", "false");
      b.onclick = function () { region = (region === r) ? null : r; paint(); };
      b.dataset.region = r;
      regionBox.appendChild(b);
    });
  }

  var itemBox = $("items");
  LAYOUT.forEach(function (row) {
    if (row.full && !FULL) { return; }
    if (row.kind === "one") {
      var b = document.createElement("button");
      b.type = "button"; b.className = "item"; b.dataset.value = row.value;
      b.setAttribute("aria-pressed", "false");
      b.innerHTML = svg(row.icon, "ico") + '<span class="name">' + row.value + "</span>" + TICK;
      b.onclick = function () { toggle(row.value); };
      itemBox.appendChild(b);
    } else {
      var g = document.createElement("div");
      g.className = "group"; g.id = "glove-group";
      var pills = row.sizes.map(function (s) {
        return '<button type="button" class="size" data-value="' + s + '" aria-pressed="false">' +
               s.replace("장갑 ", "") + "</button>";
      }).join("");
      g.innerHTML = '<div class="group-top">' + svg(row.icon, "ico") +
        '<span class="name">장갑</span><span class="sub">사이즈 선택</span></div>' +
        '<div class="sizes">' + pills + "</div>";
      g.querySelectorAll(".size").forEach(function (p) {
        p.onclick = function () { toggle(p.dataset.value); };
      });
      itemBox.appendChild(g);
    }
  });

  function toggle(v) {
    if (picked[v]) { delete picked[v]; } else { picked[v] = true; }
    paint();
  }

  function chosen() {
    return ITEM_ORDER.filter(function (v) { return picked[v]; });
  }

  /* ── 상태 반영 ─────────────────────────── */
  function paint() {
    regionBox.querySelectorAll(".chip").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.region === region));
    });
    document.querySelectorAll(".item, .size").forEach(function (b) {
      b.setAttribute("aria-pressed", String(!!picked[b.dataset.value]));
    });
    var gg = $("glove-group");
    gg.classList.toggle("on", !!(picked["장갑 S"] || picked["장갑 M"] || picked["장갑 L"]));

    var list = chosen();
    $("summary").innerHTML = "<b>" + (region || "근무 지역을 선택하세요") + "</b>" +
      (list.length ? "선택한 비품 " + list.length + "개" : "선택한 비품 0개");
    $("submit").disabled = sending || !region || list.length === 0;
    // 고정 링크는 기억할 것이 없다. 관리자용 화면의 기억을 덮어쓰지 않도록 건너뛴다.
    if (region && !LOCKED) { try { localStorage.setItem("bipum:region", region); } catch (e) {} }
  }

  if (!LOCKED) {
    try {
      var saved = localStorage.getItem("bipum:region");
      if (saved && ALLOWED.indexOf(saved) !== -1) { region = saved; }
    } catch (e) {}
  }
  paint();

  /* ── 전송: 구글폼 formResponse로 그대로 POST ──
     no-cors라 응답 내용은 못 읽지만, 요청이 구글까지 닿았는지는
     promise의 resolve/reject로 구분된다. 근무지 신호가 약할 때
     "전송 실패인데 완료 화면"이 뜨는 것을 막기 위한 장치. */
  $("submit").onclick = function () {
    if (sending) { return; }
    var list = chosen();
    if (!region || !list.length) { return; }

    sending = true;
    var btn = $("submit");
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> 전송중';
    $("error").classList.remove("show");

    var body = new URLSearchParams();
    body.append(ENTRY_REGION, region);
    list.forEach(function (v) { body.append(ENTRY_ITEMS, v); });
    if (ENTRY_CODE && ACCESS_CODE) { body.append(ENTRY_CODE, ACCESS_CODE); }

    var ctl = new AbortController();
    var giveUp = setTimeout(function () { ctl.abort(); }, 15000);

    fetch(ENDPOINT, { method: "POST", mode: "no-cors", body: body, signal: ctl.signal })
      .then(function () { clearTimeout(giveUp); succeed(region, list); })
      .catch(function () { clearTimeout(giveUp); fail(); });
  };

  function fail() {
    sending = false;
    $("submit").textContent = "다시 시도";
    $("error").classList.add("show");
    paint();
  }

  function succeed(reg, list) {
    var t = new Date();
    var when = t.getFullYear() + "." + pad(t.getMonth() + 1) + "." + pad(t.getDate()) +
               " " + pad(t.getHours()) + ":" + pad(t.getMinutes());
    $("receipt").innerHTML =
      '<div class="row"><span class="k">근무 지역</span><span class="v">' + esc(reg) + "</span></div>" +
      '<div class="row"><span class="k">요청 물품</span><span class="v">' + list.map(esc).join("<br>") + "</span></div>" +
      '<div class="row"><span class="k">신청 시각</span><span class="v">' + when + "</span></div>";
    $("done").classList.add("show");
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function esc(s) { return s.replace(/[&<>]/g, function (c) { return { "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]; }); }

  $("again").onclick = function () {
    picked = {};
    sending = false;
    $("submit").textContent = "신청하기";
    $("done").classList.remove("show");
    window.scrollTo(0, 0);
    paint();
  };
})();
</script>
</body>
</html>
